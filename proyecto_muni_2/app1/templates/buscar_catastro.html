{% extends "base.html" %}
{% load static %}

{% block title %}Buscar Catastro{% endblock %}

{% block extra_head %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/catastro.css' %}">
{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center mb-4">Consulta de Datos Catastrales</h2>

    <form method="get" action="{% url 'buscar_catastro' %}" class="row g-3 justify-content-center">
        <div class="col-md-5">
            <label for="numero_catastro" class="form-label">Número de Catastro</label>
            <input type="text" class="form-control" id="numero_catastro" name="numero_catastro" placeholder="Ej: 123456">
        </div>

        <div class="col-md-5">
            <label for="dni_propietario" class="form-label">DNI del Propietario</label>
            <input type="text" class="form-control" id="dni_propietario" name="dni_propietario" placeholder="Ej: 30111222">
        </div>

        <div class="col-12 d-flex justify-content-center gap-3 mt-3">
            <button type="submit" class="btn btn-primary">Buscar</button>
            <a href="{% url 'catastro_info' %}" class="btn btn-secondary">Volver</a>
        </div>
    </form>

    {% if resultados %}
        <div class="mt-5">
            <h4>Resultados:</h4>
            <!-- Aquí iría el listado de resultados -->
        </div>
    {% elif mensaje %}
        <div class="mt-5 alert alert-info">
            {{ mensaje }}
        </div>
    {% endif %}
</div>
{% endblock %}
