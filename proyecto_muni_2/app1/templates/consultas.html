{% extends "base.html" %}
{% load static %}

{% block title %}Consultas Sociales{% endblock %}

{% block extra_head %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/consultas.css' %}">
{% endblock %}

{% block content %}
<main class="consulta-container">
  <h2>Formulario de Consulta</h2>

  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label for="id_asunto">Asunto</label>
      <input type="text" name="asunto" id="id_asunto" class="form-control" required>
    </div>
    <div class="form-group">
      <label for="id_mensaje">Mensaje</label>
      <textarea name="mensaje" id="id_mensaje" class="form-control" rows="5" required></textarea>
    </div>
    <div class="botones">
      <button type="submit" class="btn btn-primary">Enviar Consulta</button>
      {% if user.is_staff %}
        <a href="{% url 'ver_consultas' %}" class="btn btn-secondary">Ver Consultas</a>
      {% endif %}
    </div>
  </form>
</main>
{% endblock %}
