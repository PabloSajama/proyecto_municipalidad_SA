{% extends "base.html" %}
{% load static %}

{% block title %}Crear Catastro{% endblock %}

{% block extra_head %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2 class="mb-4 text-center">Crear Nuevo Catastro</h2>

    <form method="post" class="p-4 border rounded bg-light">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="text-center mt-4">
            <button type="submit" class="btn btn-success">Guardar Catastro</button>
            <a href="{% url 'buscar_catastro' %}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
