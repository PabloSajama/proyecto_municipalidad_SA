{% extends "base.html" %}
{% load static %}

{% block title %}Crear Contacto - Municipalidad{% endblock %}

{% block extra_head %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="{% static 'css/crear_contacto.css' %}">
{% endblock %}

{% block content %}
<div class="container my-5" style="max-width: 600px;">
  <h2 class="mb-4 text-center">Crear Nuevo Contacto</h2>
  
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    
    <div class="mb-3">
      <label for="id_nombre_completo" class="form-label">Nombre Completo</label>
      <input type="text" class="form-control" id="id_nombre_completo" name="nombre_completo" required>
    </div>

    <div class="mb-3">
      <label for="id_puesto" class="form-label">Puesto / Rol</label>
      <input type="text" class="form-control" id="id_puesto" name="puesto" required>
    </div>

    <div class="mb-3">
      <label for="id_descripcion" class="form-label">Descripción</label>
      <textarea class="form-control" id="id_descripcion" name="descripcion" rows="3" required></textarea>
    </div>

    <div class="mb-3">
      <label for="id_telefono" class="form-label">Teléfono</label>
      <input type="tel" class="form-control" id="id_telefono" name="telefono" required>
    </div>

    <div class="mb-3">
      <label for="id_correo" class="form-label">Correo Electrónico</label>
      <input type="email" class="form-control" id="id_correo" name="correo" required>
    </div>

    <div class="mb-3">
        <label for="id_imagen" class="form-label">Imagen</label>
        <input type="file" class="form-control" id="id_imagen" name="imagen" accept="image/*" required>
    </div>

    <button type="submit" class="btn btn-primary w-100">Guardar Contacto</button>
  </form>
</div>
{% endblock %}
