{% extends "base.html" %}
{% load static %}

{% block title %}Rechazar Solicitud{% endblock %}

{% block extra_head %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/estilo_bienvenida.css' %}">
{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="card card-yellow mx-auto" style="max-width: 600px;">
        <h3>Rechazar solicitud</h3>

        <p><strong>{{ solicitud.razon_social }}</strong></p>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Observación / Motivo</label>
                <textarea name="observacion_admin" class="form-control" rows="4" required></textarea>
            </div>

            <div class="d-flex justify-content-center gap-3">
                <button type="submit" class="btn">
                    Confirmar rechazo
                </button>
                <a href="{% url 'ver_solicitud_habilitacion' solicitud.id_solicitud %}" class="btn">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
