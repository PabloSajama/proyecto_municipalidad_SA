{% extends "base.html" %}
{% load static %}

{% block title %}Tipo de Servicios - Municipalidad{% endblock %}

{% block extra_head %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/estilo_servicios.css' %}">
{% endblock %}

{% block content %}
<main>
    <div class="cards-container">
        <div class="card card-blue">
            <img src="https://images.unsplash.com/photo-1590080877807-49d7ccebc313?auto=format&fit=crop&w=150&q=80" alt="Catastros">
            <h2>Catastros</h2>
            <a href="{% url 'catastro_info' %}" class="btn">Ver Más</a>
        </div>

        <div class="card card-yellow">
            <img src="https://images.unsplash.com/photo-1543269865-cbf427effbad?auto=format&fit=crop&w=150&q=80" alt="Rentas">
            <h2>Finanzas</h2>
            <a href="{% url 'rentas' %}" class="btn">Ver Más</a>
        </div>

        <div class="card card-purple">
            <img src="https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=150&q=80" alt="Consultas Ciudadanas">
            <h2>Consultas Ciudadanas</h2>
            <a href="{% url 'consultas' %}" class="btn">Ver Más</a>
        </div>

    </div>
</main>
{% endblock %}
