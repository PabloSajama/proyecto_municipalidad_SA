<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Municipalidad - Iniciar Sesión</title>
    {% load static %}

    {% block estilo %}
    {% block title %}{% endblock %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/estilo_login.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <header>
        <h1>Municipalidad</h1>
    </header>

    <nav>
        <div>
            <a href="{% url 'bienvenida' %}">Inicio</a>
            <a href="{% url 'contactos' %}">Contacto</a>
            <a href="{% url 'registro' %}">Registrarse</a>
        </div>
    </nav>

    <main>
        <div class="form-container" role="main">
            <h2>Iniciar Sesión</h2>
            <form action="/login" method="post" novalidate>
                <label for="username">Nombre de Usuario:</label>
                <input type="text" id="username" name="username" required autocomplete="username" placeholder="Ingresa tu usuario" />

                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Ingresa tu contraseña" />

                <button type="submit">Iniciar Sesión</button>
            </form>
        </div>
    </main>

    <footer>
        &copy; Municipalidad de San Antonio de los Cobres - Todos los derechos reservados.
    </footer>
</body>
</html>
{% endblock %}
