<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Municipalidad - Registrarse</title>
    {% load static %}

    {% block estilo %}
    {% block title %}{% endblock %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/estilo_registro.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    
</head>
<body>
    <header>
        <h1>Municipalidad</h1>
    </header>

    <nav>
        <div>
            <a href="{% url 'bienvenida' %}">Inicio</a>
            <a href="{% url 'contactos' %}">Contacto</a>
            <a href="{% url 'login' %}">Iniciar Sesión</a>
        </div>
    </nav>

    <main>
        <div class="form-container" role="main">
            <h2>Registrarse</h2>
            <form action="/register" method="post" novalidate>
                <label for="dni">DNI:</label>
                <input type="text" id="dni" name="dni" required placeholder="Ingresa tu DNI" />

                <label for="fullname">Nombre Completo:</label>
                <input type="text" id="fullname" name="fullname" required placeholder="Ingresa tu nombre completo" />

                <label for="address">Dirección:</label>
                <input type="text" id="address" name="address" required placeholder="Ingresa tu dirección" />

                <label for="phone">Teléfono:</label>
                <input type="tel" id="phone" name="phone" required placeholder="Ingresa tu teléfono" />

                <label for="username">Nombre de Usuario:</label>
                <input type="text" id="username" name="username" required placeholder="Elige un nombre de usuario" />

                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required placeholder="Crea una contraseña segura" />

                <button type="submit">Registrarse</button>
            </form>
        </div>
    </main>

    <footer>
        &copy; Municipalidad de San Antonio de los Cobres - Todos los derechos reservados.
    </footer>
</body>
</html>
{% endblock %}
