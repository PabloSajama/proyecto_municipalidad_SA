{% extends "base_admin.html" %}
{% load static %}

{% block title %}Autoridades - Municipalidad{% endblock %}

{% block extra_head %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/portal/autoridades.css' %}">
{% endblock %}

{% block content %}
    <div class="text-center my-4">
        <h2>Autoridades Municipales</h2>
    </div>
    
    <div class="container d-flex flex-wrap justify-content-center gap-4">
        
        <div class="card card-azul" style="width: 18rem;">
            <a href="{% url 'historia' %}">
                <img src="{% static 'pictures/autoridades.jpg' %}" class="card-img-top" alt="¿Quiénes Somos?" />
                <div class="card-body">
                    <h5 class="card-title">¿Quiénes Somos?</h5>
                    <a href="{% url 'historia' %}" class="btn btn-primary">Conoce Más</a>
                </div>
            </a>
        </div>

        <div class="card card-verde" style="width: 18rem;">
            <a href="{% url 'organigrama' %}">
                <img src="{% static 'pictures/organigrama2.png' %}" class="card-img-top" alt="Organigrama" />
                <div class="card-body">
                    <h5 class="card-title">Organigrama</h5>
                    <a href="{% url 'organigrama' %}" class="btn btn-primary">Conoce Más</a>
                </div>
            </a>
        </div>

        <div class="card card-roja" style="width: 18rem;">
            <a href="{% url 'intendencias' %}">
                <img src="{% static 'pictures/intendecisa.png' %}" class="card-img-top" alt="Intendencias" />
                <div class="card-body">
                    <h5 class="card-title">Intendencias</h5>
                    <a href="{% url 'intendencias' %}" class="btn btn-primary">Conoce Más</a>
                </div>
            </a>
        </div>
    </div>
{% endblock %}
